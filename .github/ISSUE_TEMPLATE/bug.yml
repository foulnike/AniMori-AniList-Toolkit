name: Что-то сломалось
description: Ошибка в скрипте или в приложении для Windows
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что нашли время на отчёт. Чем точнее заполнены поля, тем быстрее найдётся причина.
  - type: dropdown
    id: build
    attributes:
      label: Сборка
      description: Скрипт и приложение работают по-разному, и часть возможностей есть только в одной из них.
      options:
        - Пользовательский скрипт (Tampermonkey)
        - Приложение для Windows
        - Не знаю
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия AniMori
      description: У скрипта видна в менеджере скриптов, у приложения — в настройках, раздел «О программе».
      placeholder: 3.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Для скрипта — браузер и менеджер скриптов, для приложения — версия Windows.
      placeholder: Chrome 141 и Tampermonkey 5.3 либо Windows 11 23H2
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Где это видно
      description: Для скрипта — адрес страницы AniList. Для приложения — название экрана: главная, списки, поиск, карточка, плеер, настройки.
      placeholder: карточка тайтла либо https://anilist.co/anime/207141/
  - type: textarea
    id: steps
    attributes:
      label: Что делали, чего ждали, что получилось
      description: Пошагово, даже если шагов всего два. Скриншот можно просто перетащить сюда.
      placeholder: |
        1. Открыл карточку тайтла.
        2. Нажал кнопку «Смотреть».
        Ждал плеер, получил пустое окно.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Записи журнала
      description: Для скрипта — Настройки, раздел отладки. В приложении журнал скрыт и в меню его нет — если записей нет, оставьте поле пустым: шагов достаточно.
      render: text
  - type: input
    id: network
    attributes:
      label: Настройка сети
      description: Только для приложения: включена ли настройка соединения.
      placeholder: выключена
  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: Стоит последняя версия AniMori
          required: true
        - label: Поиск по существующим issue ничего похожего не дал
          required: true
        - label: Проверено с отключёнными другими расширениями (для скрипта)

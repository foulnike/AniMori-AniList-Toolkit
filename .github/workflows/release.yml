# Выпуск юзерскрипта.
#
# Запуск только по тегу вида script-2.1.0. Приставка обязательна: у двух продуктов
# одного проекта теги должны различаться, иначе выпуск скрипта будет заодно запускать
# сборку приложения в другой ветке. Старые теги v1.7.4…v2.0.2 остаются как есть:
# тогда оба продукта действительно выходили вместе из одного тега.
#
# Что уезжает в релиз:
#   1. animori.user.js — сама сборка;
#   2. animori.meta.js — один заголовок. По нему менеджеры скриптов проверяют обновление,
#      не скачивая весь файл.
#
# Раздача идёт через Greasy Fork: downloadURL и updateURL в заголовке смотрят туда,
# и обновление людям приходит оттуда. Артефакты релиза — копия для тех, кто ставит
# руками, и точка, с которой Greasy Fork можно синхронизировать.
#
# ubuntu-latest, а не windows-latest: Rust, WebView2 и подпись установщика здесь больше
# не участвуют, и прогон из десятков минут превращается в пару.
#
# Отмена выпуска — как и прежде: сначала Cancel во вкладке Actions, потом удаление
# тега. Удалённый тег уже запущенный прогон не останавливает.

name: release

on:
  push:
    tags:
      - 'script-*'

# Без этого токен прогона только читает, и создание релиза упадёт на 403.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Заголовок скрипта берёт версию из package.json — это единственный источник
      # номера в ветке. Если тег и package.json расходятся, люди получат обновление
      # с чужим номером, и менеджер скриптов больше не увидит следующее. Лучше
      # сломаться здесь, чем выложить такое.
      - name: Сверка версии с тегом
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#script-}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Тег script-$tag не совпадает с version в package.json ($pkg)." >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Зависимости npm
        run: npm ci

      # Внутри — vue-tsc --noEmit и только потом vite build: выкладывать сборку, не
      # прошедшую проверку типов, незачем. Порядка шагов, как прежде, теперь
      # соблюдать не надо: в dist пишет один продукт.
      - name: Сборка
        run: npm run build

      # Текст верхнего раздела CHANGELOG уходит в описание релиза. Разбор тот же,
      # что был: строки между первым и вторым заголовками вида "## [".
      #
      # Потолка в 3000 символов больше нет: он стоял из-за манифеста обновлений
      # приложения, куда этот же текст попадал целиком. Здесь манифеста нет.
      - name: Описание релиза из CHANGELOG
        id: notes
        run: |
          body=$(awk '/^## \[/ { n++; if (n == 2) exit; next } n == 1' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo 'В CHANGELOG.md не найден непустой верхний раздел вида "## [версия]"' >&2
            exit 1
          fi
          {
            echo 'body<<ANIMORI_NOTES'
            printf '%s\n' "$body"
            echo 'ANIMORI_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AniMori — юзерскрипт ${{ steps.ver.outputs.value }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          # Если сборка не положила файл на место — падать, а не выкладывать пустой релиз.
          fail_on_unmatched_files: true
          files: |
            dist/animori.user.js
            dist/animori.meta.js

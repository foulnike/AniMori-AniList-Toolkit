# Ручная проба обхода Шикимори перед сборкой датасета имён (этап 2, шаг 3).
#
# Прогон ничего не выкладывает и ничего не меняет в репозитории: он только
# спрашивает и считает. Поэтому запуск только руками и права на чтение.
#
# ПРО ВЕТКУ. Кнопка "Run workflow" показывается лишь тогда, когда файл прогона
# лежит в ветке по умолчанию, а она тут main. Поэтому копия этого файла живёт
# и в main, а сам скрипт — только в app-3.0-dev. В списке "Use workflow from"
# выбирай app-3.0-dev: с main прогон честно упадёт на первой же проверке.
#
# ПРО ВЫБОРКУ. sample — сколько номеров спросить, по 50 в запросе. 3000 это
# 60 запросов и около минуты: хватит, чтобы увидеть покрытие и отказ по адресу.
# Минутный лимит Шикимори (90 запросов) такая выборка не задевает; чтобы
# проверить именно его, ставь 6000 и больше. Зерно держит выборку той же,
# так что два прогона с разной паузой сравнимы между собой.

name: probe-titles

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Сколько номеров спросить у Шикимори'
        default: '3000'
      pause:
        description: 'Пауза между запросами, мс'
        default: '700'
      seed:
        description: 'Зерно выборки'
        default: '20260822'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # Потолок на случай, если зеркало начнёт отвечать по минуте на запрос.
    timeout-minutes: 30

    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      # Внятный отказ вместо "Cannot find module" в середине лога.
      - name: Проверка ветки
        run: |
          if [ ! -f scripts/probe-titles.mjs ]; then
            echo 'Скрипта пробы нет в этой ветке. Запусти прогон из app-3.0-dev:' >&2
            echo 'Actions -> probe-titles -> Run workflow -> Use workflow from.' >&2
            exit 1
          fi

      # Зависимостей у пробы нет, поэтому ни npm ci, ни кэша: только сам Node.
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проба
        env:
          PROBE_SAMPLE: ${{ inputs.sample }}
          PROBE_PAUSE: ${{ inputs.pause }}
          PROBE_SEED: ${{ inputs.seed }}
          # Нужен только чтобы не упереться в лимит анонимных запросов к API GitHub
          # при чтении выпуска манами. Прав на запись у него тут нет.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/probe-titles.mjs

      # Числа видны прямо в итоге прогона, файл — на случай разбора руками.
      - name: Отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe-result.json
          if-no-files-found: warn

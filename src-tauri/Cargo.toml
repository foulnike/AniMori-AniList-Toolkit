[package]
name = "animori"
version = "3.0.0"
description = "AniMori — Toolkit for AniList, desktop shell"
authors = ["foulnike"]
license = "MIT"
repository = "https://github.com/foulnike/AniMori-AniList-Toolkit"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "animori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
  "socks",
] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2.5.4"
# Пункт 4.5: запоминает размер, положение и состояние окна между запусками.
# Плагин десктопный: на мобильных платформах его в зависимости не добавляют, но
# сборок под них у нас нет, поэтому cfg-таргет здесь только запутывал бы Cargo.toml.
# Требует Rust >= 1.77.2 — ровно ту версию, что уже указана в rust-version выше.
tauri-plugin-window-state = "2"

# Пункт П.2: автообновление.
#
# updater скачивает latest.json с GitHub, сверяет версию с текущей, проверяет подпись
# установщика публичным ключом из tauri.conf.json и запускает его. Без верной подписи
# файл не будет запущен вовсе — это единственная защита от подмены обновления.
#
# dialog нужен ровно для двух родных окошек: спросить согласия на установку и сообщить об
# ошибке. Своё окно для этого не годится: проверка идёт из Rust сразу после создания
# окна, когда разметка может быть ещё не готова, и ждать её ради вопроса незачем.
#
# Оба плагина дёргаются ТОЛЬКО из Rust. Разрешений в capabilities/default.json им не
# выдано сознательно: разметке право запустить загрузку и установку исполняемого файла
# не нужно вовсе, а выданное разрешение обратно уже не отберёшь.
#
# Плагин process из первоначального плана не нужен: перезапуск делает app.restart() —
# метод самого ядра Tauri, отдельный плагин ему не требуется.
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Доступ к движку окна из Rust.
#
# Зачем нужны эти две зависимости. Потребитель один — proxy_auth.rs: запрос
# учётных данных у прокси приходит событием WebView2, и ответить на него можно
# только на уровне самого движка. Событие живёт в COM-интерфейсах Microsoft,
# а обёртки к ним и есть webview2-com и windows.
#
# Прежде тем же способом отменялись рекламные запросы внутри кадра плеера.
# Блокировщик ушёл вместе с гибридным окном, крейты остались ради прокси.
#
# Версии подобраны НЕ на глаз: их уже тянет wry 0.55.1 (движок окон Tauri), см.
# Cargo.lock — webview2-com 0.38.2, windows 0.61.3. Брать другую мажорную версию нельзя:
# тогда в сборке окажутся два несовместимых набора одних и тех же типов, и
# PlatformWebview::controller() перестанет подходить к нашему коду.
#
# cfg(windows) обязателен: этих крейтов нет ни под Linux, ни под macOS, и без
# ограничения по платформе проект перестал бы собираться где угодно, кроме Windows.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }

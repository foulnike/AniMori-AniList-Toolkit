<!doctype html>
<!-- Тема стоит в разметке дефолтом: настройки читаются асинхронно, и без неё
     первый кадр был бы белым. startAppearance() из main.ts перепишет атрибут,
     когда выбор человека прочитан, и делает это до первой отрисовки. -->
<html lang="ru" data-am-skin="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniMori</title>
  </head>
  <body>
    <!-- Корень из src/app/main.ts. Имя id менять нельзя в одном месте. -->
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
